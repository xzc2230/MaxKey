map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# 客服登录与 OIDC。浏览器只访问这个域名上的 /maxkey/ 和 /sign/。
server {
    listen 80;
    server_name sso.tdafadfaww.com;

    client_max_body_size 20m;

    location /maxkey/ {
        proxy_pass http://maxkey-auth-web:8527;
        include /etc/nginx/proxy-params.conf;
    }

    location /sign/ {
        proxy_pass http://maxkey-auth:9527;
        include /etc/nginx/proxy-params.conf;
    }
}

# 管理端。安全组仍只放行运维 IP。公网开放 80/443 之前，把下面改成运维公网 IP 并加上 deny all。
server {
    listen 80;
    server_name iam-admin.tdafadfaww.com;

    allow all;

    client_max_body_size 20m;

    location /maxkey-mgt/ {
        proxy_pass http://maxkey-mgt-web:8526;
        include /etc/nginx/proxy-params.conf;
    }

    location /maxkey-mgt-api/ {
        proxy_pass http://maxkey-mgt:9526;
        include /etc/nginx/proxy-params.conf;
    }
}

# Chatwoot。业务系统嵌入的聊天组件和客服收件箱都走这里。
server {
    listen 80;
    server_name chat.tdafadfaww.com;

    client_max_body_size 40m;

    location / {
        proxy_pass http://chatwoot-rails:3000;
        include /etc/nginx/proxy-params.conf;
    }
}

# 客服入口。/ 走 MaxKey。/visitor 是匿名访客测试页。/customer 是模拟已登录业务客户的测试页。
# 正式客户留在业务系统自己的页面里，加载 chat 域名上的聊天组件。
server {
    listen 80;
    server_name agent.tdafadfaww.com;

    location / {
        proxy_pass http://agent-bridge:3011;
        include /etc/nginx/proxy-params.conf;
    }
}
