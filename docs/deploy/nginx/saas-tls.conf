map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name sso.tdafadfaww.com iam-admin.tdafadfaww.com chat.tdafadfaww.com agent.tdafadfaww.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sso.tdafadfaww.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 20m;

    location /maxkey/ {
        proxy_pass http://maxkey-auth-web:8527;
        include /etc/nginx/proxy-params.conf;
    }

    location /sign/ {
        proxy_pass http://maxkey-auth:9527;
        include /etc/nginx/proxy-params.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name iam-admin.tdafadfaww.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    allow 10.0.0.0/8;
    deny all;

    client_max_body_size 20m;

    location /maxkey-mgt/ {
        proxy_pass http://maxkey-mgt-web:8526;
        include /etc/nginx/proxy-params.conf;
    }

    location /maxkey-mgt-api/ {
        proxy_pass http://maxkey-mgt:9526;
        include /etc/nginx/proxy-params.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.tdafadfaww.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 40m;

    location / {
        proxy_pass http://chatwoot-rails:3000;
        include /etc/nginx/proxy-params.conf;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name agent.tdafadfaww.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://agent-bridge:3011;
        include /etc/nginx/proxy-params.conf;
    }
}
